# ═══════════════════════════════════════════════════════════
#  Indra —— 封禁模块消息格式
#  支持 & 颜色代码与 \n 换行
#
#  移植自 Phoenix v1.16.0 的 PhoenixBan/messages.yml
# ═══════════════════════════════════════════════════════════

Message-Format:
  # ── 请出 ──
  # {0} 玩家名 / {1} UUID / {2} 原因 / {3} 操作管理 / {4} 操作时间
  Kick:
    - "&c您已被管理员从服务器请出！\n"
    - "\n"
    - "&7玩家名称: &f{0}\n"
    - "&7请出原因: &f{2}\n"
    - "\n"
    - "&7操作管理: &f{3}\n"
    - "&7操作时间: &f{4}\n"
    - "\n"

  # ── 封禁 ──
  # {0} 玩家名 / {1} UUID / {2} 原因 / {3} 操作管理
  # {4} 封禁时间 / {5} 解封时间 / {6} 封禁时长
  Ban:
    - "&c您已被管理员从服务器封禁至{5}！\n"
    - "\n"
    - "&7玩家名称: &f{0}\n"
    - "&7封禁原因: &f{2}\n"
    - "\n"
    - "&7操作管理: &f{3}\n"
    - "&7操作时间: &f{4}\n"
    - "&7封禁时长: &f{6}\n"
    - "\n"

  # ── 白名单 ──
  # {0} 玩家名 / {1} UUID
  Whitelist:
    - "&c您不在服务器的白名单中！\n"
    - "\n"
    - "&7玩家名称: &f{0}\n"
    - "&7申请白名单: &b&n请前往服务器交流群/官网\n"
    - "\n"

  # ── 警告 ──
  # {0} 玩家名 / {1} UUID / {2} 原因 / {3} 操作管理 / {4} 操作时间
  Warn:
    - "&c您收到了一条管理员警告！\n"
    - "\n"
    - "&7警告原因: &f{2}\n"
    - "&7操作管理: &f{3}\n"
    - "&7操作时间: &f{4}\n"
    - "&7请遵守服务器规则，再犯将被封禁\n"
    - "\n"
