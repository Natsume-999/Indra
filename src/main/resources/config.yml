# ═══════════════════════════════════════════════════════════
#  Indra —— RPG 服务器基础功能插件
#  配置文件：修改后执行 /indra reload 即可生效
# ═══════════════════════════════════════════════════════════

# 调试模式：开启后会在控制台输出生成拦截日志
debug: false

# 是否在控制台打印模块加载详情
verbose: true

# ───────────────────────────────────────────────────────────
#  原版生物生成控制（核心功能）
# ───────────────────────────────────────────────────────────
spawn:
  # 总开关：true = 禁止原版生物生成
  disable-vanilla-spawn: true

  # 世界白名单：列表内的世界「不受拦截」（即允许原版生成）
  # 留空表示所有世界都禁止
  allow-worlds: []

  # 生成原因白名单：符合这些原因的生成会被放行
  # 常用值：CUSTOM(自定义刷怪) / SPAWNER(刷怪笼) / EGG(刷怪蛋)
  #        / COMMAND(指令) / BUILDING(雪傀儡等)
  allow-reasons:
    - CUSTOM
    - SPAWNER
    - EGG
    - COMMAND

  # 实体白名单：这些生物即使自然生成也放行
  # 适合保留村民、宠物、功能性生物
  whitelist-entities:
    - VILLAGER
    - WANDERING_TRADER
    - WOLF
    - CAT
    - HORSE
    - IRON_GOLEM

  # 是否禁止刷怪笼生成（在上面的 allow-reasons 含 SPAWNER 时被覆盖）
  disable-spawner: false

  # 是否禁止带 Indra 等级标记的生物被服务器自然清理
  # 建议保持 true，避免自定义怪消失
  disable-despawn: true

# ───────────────────────────────────────────────────────────
#  怪物等级强化
# ───────────────────────────────────────────────────────────
mob-level:
  enable: true

  # 每隔多少格距离提升 1 级（以世界原点 0,0 为中心）
  blocks-per-level: 100.0

  # 每级血量倍率（累乘）：1.15 表示每级血量 ×1.15
  health-per-level: 1.15

  # 每级攻击力加成（累加）
  attack-per-level: 0.5

  # 是否在怪物头顶显示等级
  show-name: true

# ───────────────────────────────────────────────────────────
#  玩家等级与经验
# ───────────────────────────────────────────────────────────
player:
  # 新玩家初始等级
  default-level: 1

  # 新玩家初始经验
  default-exp: 0

  # 等级上限
  max-level: 100

  # 升级所需经验基数：实际需求 = 基数 × 当前等级
  exp-per-level: 100

  # 每级奖励的点数（预留给技能/天赋系统）
  points-per-level: 3

  # 击杀怪物获得经验 = 该值 × 怪物等级
  exp-per-mob-level: 5

  # 首次进服欢迎语，可用 {player} 占位
  welcome-message: "&a欢迎来到服务器，&e{player}&a！这是你第一次来到这里。"

# ───────────────────────────────────────────────────────────
#  死亡惩罚
# ───────────────────────────────────────────────────────────
death:
  enable-penalty: true
  # 死亡扣除当前经验的比例（0.0 ~ 1.0）
  exp-penalty-ratio: 0.1

# ───────────────────────────────────────────────────────────
#  聊天格式
# ───────────────────────────────────────────────────────────
chat:
  enable-format: true
  # 可用占位符：{player} 玩家名 / {level} 等级 / {message} 消息内容
  format: "&7[&eLv.{level}&7] &f{player} &8» &7{message}"

# ───────────────────────────────────────────────────────────
#  数据存储
#  实际连接配置在 datasource.yml
# ───────────────────────────────────────────────────────────
database:
  # 自动保存间隔（秒）
  auto-save-interval: 300

# ───────────────────────────────────────────────────────────
#  消息文本（可自行修改）
# ───────────────────────────────────────────────────────────
messages:
  prefix: "&b[Indra] &r"
  no-permission: "&c你没有权限执行这个操作。"
  player-not-found: "&c玩家不在线：{player}"
  reload-success: "&a配置已重载。"
