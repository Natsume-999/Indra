# ═══════════════════════════════════════════════════════════════════
#  Indra 出售界面
#  -------------------------------------------------------------------
#  一个文件可以写多个界面（每个顶层键 = 一个界面）。
#  格式与 Phoenix（VitaSell）100% 兼容，可直接拷入。
#
#  ── 字段说明 ──────────────────────────────────────────────────
#    Title       界面标题（支持 & 颜色码）
#    Layout      布局网格，**每行必须是 9 个字符**，最多 6 行
#    Auto-Sell   是否自动出售：物品放入后立即结算
#    Icon        字符 → 图标定义
#
#  ── 布局的核心规则（务必理解）─────────────────────────────────
#    Layout 里的每个字符，去 Icon 里找同名键：
#      · Icon 里**有**这个字符 → 该槽位放对应的图标（装饰 或 按钮）
#      · Icon 里**没有**这个字符 → 该槽位是**玩家可放入物品的空位**
#
#    所以 '         '（9 个空格）就是「一整行都能放物品」。
#    空格不需要在 Icon 里定义 —— 这是与 Phoenix 一致的隐式约定。
#
#  ── Bind 绑定动作（写在 Icon 里）──────────────────────────────
#    Close  关闭界面
#    Sell   点击出售界面内的物品
#    Put    一键放入：把背包里可出售的物品搬进界面
#
#    Put 可选 `Put-Match: "匹配串"` 限定只放某一类物品；
#    不写则放入「所有能匹配到规则的物品」。
# ═══════════════════════════════════════════════════════════════════

Example:
  # 界面标题
  Title: "§6出售界面"
  # 界面布局（每行 9 字符）
  Layout:
    - '####S####'
    - '         '
    - '         '
    - '         '
    - '         '
    - '####P###C'
  # 自动出售：放入物品即结算
  Auto-Sell: false
  # 图标
  Icon:
    '#':
      Type: 'GRAY_STAINED_GLASS_PANE'
      Data: 7
      Name: '§8'
      Lore: [ ]
    'C':
      Type: 'GRAY_STAINED_GLASS_PANE'
      Data: 14
      Name: '§c关闭菜单'
      Lore: [ ]
      Bind: "Close"
    'S':
      Type: 'YELLOW_STAINED_GLASS_PANE'
      Data: 4
      Name: '§e点击出售'
      Lore: [ ]
      Bind: "Sell"
    'P':
      Type: 'GREEN_STAINED_GLASS_PANE'
      Data: 5
      Name: '§a一键放入'
      Lore: [ ]
      Bind: "Put"
      Put-Match: "name:&f示例材料;lore:contains(&a可回收)"
