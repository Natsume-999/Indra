# ═══════════════════════════════════════════════════════════
#  Indra —— 封禁模块设置
#  修改后执行 /indra reload 生效
#
#  移植自 Phoenix v1.16.0 的 PhoenixBan/config.yml
# ═══════════════════════════════════════════════════════════

# 是否启用白名单
#   true  → 只有白名单内的玩家能进服
#   false → 不限制（推荐，白名单一般用服务器自带的 whitelist.json）
Whitelist: false

# 封禁主键策略
#   uuid → 按 UUID 记录（推荐，玩家改名无法绕过封禁）
#   name → 按玩家名记录（改名可绕过，仅在需要人名可读时启用）
Player-ID: uuid

# ───────────────────────────────────────────────────────────
#  默认值：管理员未填原因时的兜底文案
# ───────────────────────────────────────────────────────────
Default-Value:
  Kick-Reason: "管理员未填写请出原因"
  Ban-Reason: "管理员未填写封禁原因"
  Warn-Reason: "管理员未填写警告原因"

# ───────────────────────────────────────────────────────────
#  警告系统
# ───────────────────────────────────────────────────────────
Warning:
  # 警告累计到该次数自动封禁；0 = 关闭自动封禁
  Auto-Ban-Threshold: 0
  # 自动封禁时长（单位见下方 Time-Format.Duration）
  Auto-Ban-Duration: "1d"
  # 自动封禁原因
  Auto-Ban-Reason: "警告次数过多"

# ───────────────────────────────────────────────────────────
#  自动解封
# ───────────────────────────────────────────────────────────
Auto-Unban:
  # 是否启用到期自动解封
  Enabled: true
  # 扫描周期（秒，最小 1）
  Interval-Seconds: 30
  # 解封后执行的 Kether 脚本
  # 可用变量：{player} {uuid} {reason} {duration} {ban_time} {unban_time} {banning_admin}
  Actions:
    - 'tell {player} 到 &a你的封禁已到期，现已解除。'
    # - 'command console broadcast &a[系统] {player} 的封禁已到期解除'

# ───────────────────────────────────────────────────────────
#  时间格式
# ───────────────────────────────────────────────────────────
Time-Format:
  Date: "yyyy-MM-dd"
  Time: "yyyy-MM-dd HH:mm:ss"
  # 时长单位符号（解析与显示共用）
  Duration:
    Second: "s"
    Minute: "m"
    Hour: "H"
    Day: "d"
    Week: "w"
    Month: "M"
    Year: "y"
  # 永久封禁的时长表示（仅用于展示）
  Permanent: "10y"
