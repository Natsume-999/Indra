# ═══════════════════════════════════════════════════════════════════
#  Indra 出售规则
#  -------------------------------------------------------------------
#  一个文件可以写多条规则（每个顶层键 = 一条规则）。
#  匹配时按「文件名字母序 + 文件内顶层键顺序」，命中**第一条**即生效。
#
#  格式与 Phoenix（VitaSell）100% 兼容，可直接拷入。
#
#  ── 字段说明 ──────────────────────────────────────────────────
#    Item      物品匹配串（Arim 裁剪版，见下）
#    Table     限定生效的界面名；留空 = 全部界面生效
#    Condition 出售条件（Kether 脚本列表，全部为真才可出售）
#    Action.Money   金钱，格式 "数值 权重"，支持 "最小值~最大值"
#    Action.Point   点券，格式同上
#    Action.Kether  成交后额外执行的脚本
#
#  ⚠️⚠️ 符号语义（继承 VitaSell，务必注意）⚠️⚠️
#    Money / Point 的数值 **负数表示给予玩家，正数表示扣除**。
#    这是为了让既有 Phoenix 配置迁移后不会反向扣钱。
#    例："-100 75" = 75% 概率给予 100 金币
#
#  ── 权重与区间 ────────────────────────────────────────────────
#    "数值 权重"         权重是一个固定值，按比例抽取
#    "-500 20~25"        数值 -500；权重在 20~25 之间（按期望值 22.5 处理）
#    "-200~-100 25"      数值在 -200 ~ -100 之间随机；权重 25
#
#  权重只在**同一条规则内**比较，不同规则之间互不影响。
#
#  ── Item 匹配串支持的条件（分号分隔，多条件 AND）─────────────
#    name:<文本>              显示名完全等于
#    name:contains(<文本>)    显示名包含
#    name:!contains(<文本>)   显示名不包含
#    lore:<文本>              Lore 任一行完全等于
#    lore:contains(<文本>)    Lore 任一行包含
#    lore:!contains(<文本>)   Lore 任一行都不包含
#    type:<材质>              材质（可用逗号写多个：type:STONE,DIRT）
#    amount:<n>               数量至少 n 个
#    amount:>=n / >n / =n / <n / <=n / !=n
#    custommodeldata:<n>      自定义模型数据
#    unbreakable:true|false   是否不可破坏
#
#  颜色码 `&a` 与 `§a` 等价，写哪个都能匹配。
#
#  ⚠️ 不支持 nbt: / tag: / itemmodel: 及各类插件物品。
#     需要复杂判断请改用 Condition 的 Kether 脚本。
# ═══════════════════════════════════════════════════════════════════

# ── 示例一：按名字回收 ─────────────────────────────────────────
Example:
  Item: "name:&f示例材料;lore:contains(&a可回收)"
  Table: ""
  Condition: [ ]
  Action:
    Money:
      - "-200~-100 25"
      - "-500 20~25"
      - "-1000 75"
    Point:
      - "10 2"
      - "15~20 8"
    Kether: [ ]

# ── 示例二：按材质回收（最常用）──────────────────────────────
# 用 type: 直接按材质名回收，不依赖显示名，最稳妥。
# 取消注释即可启用。
#
# IronIngot:
#   Item: "type:IRON_INGOT"
#   Table: ""
#   Action:
#     Money:
#       - "-50 100"
#
# GoldIngot:
#   Item: "type:GOLD_INGOT"
#   Table: ""
#   Action:
#     Money:
#       - "-120 100"
#
# Diamond:
#   Item: "type:DIAMOND"
#   Table: ""
#   Action:
#     Money:
#       - "-800 100"
#
# ── 示例三：带条件的规则 ───────────────────────────────────────
# 只有满足 Kether 条件才可出售（例如仅 VIP 可高价回收）
#
# VipOnly:
#   Item: "type:NETHERITE_INGOT"
#   Table: ""
#   Condition:
#     - "check &e该物品仅限 VIP 回收"
#   Action:
#     Money:
#       - "-5000 100"
#     Kether:
#       - "tell &a感谢你的回收！"
