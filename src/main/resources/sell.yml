# ═══════════════════════════════════════════════════════════════════
#  Indra 出售模块设置
#  -------------------------------------------------------------------
#  本文件只放「模块自身行为」；出售规则与界面分别在：
#      plugins/Indra/sell/*.yml     出售规则
#      plugins/Indra/table/*.yml    出售界面
#
#  这两个目录的文件格式与 Phoenix（VitaSell）100% 兼容，
#  可以直接把 Phoenix 的 sell/ 与 table/ 内容拷过来使用。
# ═══════════════════════════════════════════════════════════════════

open:
  # 执行 /indra sell（不带界面名）且只加载到 1 个界面时，是否直接打开
  # false = 总是先列出可选界面
  direct-when-single: true

options:
  # 未加载到任何界面时，打开命令是否自动释放默认示例文件并重新扫描
  # 建议保持 true —— 首次安装时能立即看到一个可用的示例界面
  auto-release-defaults: true
