group=com.indra
version=1.6.0

kotlin.incremental=true
kotlin.incremental.java=true
kotlin.caching.enabled=true
kotlin.parallel.tasks.in.project=true

# ── 关键：不要让 Kotlin 插件自动加 stdlib 依赖 ──────────────────────
# 方案 B（Kotlin 不入包，运行期下载）下这一项**必须**保持 false：
#   · 若为 true，Kotlin 插件会把 kotlin-stdlib 加进 implementation，
#     它就会被 tasks.jar 打进产物 → 又变回 1.9 MB 的方案 A。
#   · 编译期只需 compileOnly 语义即可（stdlib 由 TabooLib 的
#     common-env 模块在运行期提供），不需要随包发布。
kotlin.stdlib.default.dependency=false

# ── 构建 JDK（Paper 26.3 强制 Java 25）──────────────────────────────
# 本构建脚本刻意不使用 Gradle toolchain，而是继承运行 Gradle 的 JDK。
# 若系统默认 java 不是 25，:compileJava 会报
#     error: invalid source release: 25
# 在这里固化为绝对路径最省事；换机器时按实机路径改。
# 留空/注释掉时，用命令行显式覆盖：
#     JAVA_HOME=/path/to/jdk25 ./gradlew build
# [官方管线构建] Windows 本机使用 PATH 上的 JDK 25，无需指定 java.home

// [官方管线构建 2026-09-21] 规避 Kotlin 守护进程挂起：前台 + 进程内编译
org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=false
kotlin.compiler.execution.strategy=in-process
